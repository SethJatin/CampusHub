<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance | CampusHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>body { background: #f8f9fa; }</style>
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container py-4">
        <h2 class="mb-4"><i class="bi bi-calendar-check"></i> Mark Attendance - {{ course.name }}</h2>

        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>

                    <table class="table">
                        <thead>
                            <tr>
                                <th><input type="checkbox" id="selectAll"> Select</th>
                                <th>Student</th>
                                <th>Roll Number</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for enrollment in enrollments %}
                            <tr>
                                <td><input type="checkbox" name="students" value="{{ enrollment.student.id }}" checked></td>
                                <td>{{ enrollment.student.get_full_name }}</td>
                                <td>{{ enrollment.student.student_profile.roll_number|default:"N/A" }}</td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="3" class="text-center">No students enrolled.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>

                    <button type="submit" class="btn btn-primary">Mark Attendance</button>
                </form>
            </div>
        </div>

        <script>
            document.getElementById('selectAll').addEventListener('change', function() {
                const checkboxes = document.querySelectorAll('input[name="students"]');
                checkboxes.forEach(cb => cb.checked = this.checked);
            });
        </script>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
