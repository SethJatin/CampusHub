{% extends 'navbar.html' %}

{% block title %}{{ action }} Event - CampusHub{% endblock %}

{% block content %}
<div class="container">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'events:event_list' %}">Events</a></li>
            <li class="breadcrumb-item active">{{ action }} Event</li>
        </ol>
    </nav>

    <div class="card">
        <div class="card-header"><h4>{{ action }} Event</h4></div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'events:event_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
